apiVersion: v1
kind: Service
metadata:
  labels:
    app: jetson-exporter
    component: metrics
  name: jetson-exporter
  namespace: monitoring
spec:
  ports:
    - name: metrics
      port: {{ .Values.containerPort }}
      protocol: TCP
      targetPort: {{ .Values.containerPort }}
  selector:
    app: jetson-exporter
